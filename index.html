    // --- ANA REACT UYGULAMASI ---
    function MainApp() {
      const [currentTab, setCurrentTab] = useState('dashboard');
      const [isMobileOpen, setIsMobileOpen] = useState(false);

      // Canlı Saat State
      const [liveDateTime, setLiveDateTime] = useState('');

      const [users, setUsers] = useState(INITIAL_USERS);
      const [currentUser, setCurrentUser] = useState(INITIAL_USERS[0]); // Varsayılan: Admin (Yönetici)
      const [logs, setLogs] = useState(INITIAL_LOGS);
      const [attendanceList, setAttendanceList] = useState(INITIAL_ATTENDANCE);
      const [directoryList, setDirectoryList] = useState(INITIAL_DIRECTORY);

      const [netgsmSettings, setNetgsmSettings] = useState({
        username: "850305XXXX",
        password: "••••••••••••",
        header: "YEMTAL",
        balance: 4250,
        autoSyncMorning: "09:30",
        autoSyncAfternoon: "14:30",
        dlrWebhookUrl: "https://yemtal.meb.k12.tr/api/netgsm-dlr"
      });

      const [schoolSettings, setSchoolSettings] = useState({
        name: "Yunus Emre Mesleki ve Teknik Anadolu Lisesi",
        code: "YEMTAL-01",
        email: "idare@yemtal.meb.k12.tr",
        phone: "0 (212) 555 00 00"
      });

      // Otomasyon Öğrenci (e-Okul Veri İşleme) State
      const [eOkulStagingList, setEOkulStagingList] = useState(INITIAL_EOKUL_STAGING);
      const [autoProcessPolicy, setAutoProcessPolicy] = useState('manual'); // 'manual' | 'auto'
      const [isFetchingEOkul, setIsFetchingEOkul] = useState(false);

      const [toasts, setToasts] = useState([]);

      // Canlı Saat & Tarih Sayacı
      useEffect(() => {
        const updateTime = () => {
          const now = new Date();
          const optionsDate = { day: 'numeric', month: 'long', year: 'numeric', weekday: 'long' };
          const dateStr = now.toLocaleDateString('tr-TR', optionsDate);
          const timeStr = now.toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
          setLiveDateTime(`${dateStr} • ${timeStr}`);
        };
        updateTime();
        const timer = setInterval(updateTime, 1000);
        return () => clearInterval(timer);
      }, []);

      // Toast Bildirimi
      const showToast = (message, type = 'info') => {
        const id = Date.now() + Math.random();
        setToasts(prev => [...prev, { id, message, type }]);
        setTimeout(() => {
          setToasts(prev => prev.filter(t => t.id !== id));
        }, 3500);
      };

      // Denetim Raporu (Audit Log) Ekleme
      const addLog = (action, category, description, status = 'success') => {
        const now = new Date();
        const pad = (n) => String(n).padStart(2, '0');
        const timestamp = `${pad(now.getDate())}.${pad(now.getMonth() + 1)}.${now.getFullYear()} ${pad(now.getHours())}:${pad(now.getMinutes())}`;

        const newLog = {
          id: Date.now(),
          timestamp,
          userId: currentUser.id,
          userName: currentUser.name,
          userRole: currentUser.roleLabel,
          action,
          category,
          description,
          status,
          ip: '192.168.1.10'
        };

        setLogs(prev => [newLog, ...prev]);
      };

      // Toplu Devamsızlık SMS Gönderimi
      const handleSendBulkAttendanceSms = () => {
        const pending = attendanceList.filter(i => i.smsStatus !== 'sent');
        const count = pending.length;
        if (count === 0) return;

        setAttendanceList(prev => prev.map(i => ({ ...i, smsStatus: 'sent' })));
        setNetgsmSettings(prev => ({ ...prev, balance: prev.balance - count }));

        addLog(
          'Toplu Devamsızlık SMS Gönderimi',
          'sms',
          `${count} adet devamsız öğrenci velisine Netgsm onaylı '${netgsmSettings.header}' başlığı ile SMS iletildi.`
        );

        showToast(`${count} adet devamsızlık SMS bildirimi velilere başarıyla gönderildi!`, 'success');
      };

      // Tekil SMS
      const handleSendSingleAttendanceSms = (id) => {
        const student = attendanceList.find(i => i.id === id);
        if (!student) return;

        setAttendanceList(prev => prev.map(i => i.id === id ? { ...i, smsStatus: 'sent' } : i));
        setNetgsmSettings(prev => ({ ...prev, balance: prev.balance - 1 }));

        addLog(
          'Tekil Devamsızlık SMS Gönderimi',
          'sms',
          `${student.name} (${student.class}) velisine (${student.parentPhone}) devamsızlık SMS'i iletildi.`
        );

        showToast(`${student.name} velisine SMS gönderildi.`, 'success');
      };

      // Manuel SMS
      const handleSendManualSms = ({ targetDesc, count, messageText }) => {
        setNetgsmSettings(prev => ({ ...prev, balance: prev.balance - count }));

        addLog(
          'Manuel Mesaj Gönderimi',
          'sms',
          `"${targetDesc}" hedefine ${count} adet SMS iletildi. İçerik: "${messageText.substring(0, 40)}..."`
        );

        showToast(`${targetDesc} için ${count} adet SMS başarıyla iletildi!`, 'success');
      };

      // Rehber Güncelleme
      const handleUpdateStudent = (id, data) => {
        setDirectoryList(prev => prev.map(item => item.id === id ? { ...item, ...data } : item));
        const st = directoryList.find(i => i.id === id);
        
        addLog(
          'Rehber İletişim Güncellemesi',
          'directory',
          `${st?.name || id} öğrencisinin veli iletişim telefonu güncellendi.`
        );

        showToast('Veli iletişim bilgileri güncellendi!', 'success');
      };

      // Admin Kullanıcı Ekleme: Ad Soyad, Telefon No, Şifre, Rol (Admin, Müdür, Müdür Yrd, Öğretmen)
      const handleAddUser = (userData) => {
        const now = new Date();
        const pad = (n) => String(n).padStart(2, '0');
        const today = `${pad(now.getDate())}.${pad(now.getMonth() + 1)}.${now.getFullYear()}`;

        const newUser = {
          id: Date.now(),
          ...userData,
          createdAt: today,
          lastLogin: 'Henüz giriş yapmadı'
        };

        setUsers(prev => [...prev, newUser]);

        addLog(
          'Yeni Yetkili Kullanıcı Oluşturuldu',
          'user_mgmt',
          `${newUser.name} (${newUser.roleLabel} - Tel: ${newUser.phone}) adına yeni sistem hesabı tanımlandı.`
        );

        showToast(`${newUser.name} (${newUser.roleLabel}) hesabı oluşturuldu!`, 'success');
      };

      // Admin Kullanıcı Silme
      const handleDeleteUser = (userId) => {
        const target = users.find(u => u.id === userId);
        if (!target) return;

        if (target.role === 'admin') {
          showToast('Ana Admin hesabı silinemez!', 'error');
          return;
        }

        setUsers(prev => prev.filter(u => u.id !== userId));

        addLog(
          'Kullanıcı Hesabı Silindi',
          'user_mgmt',
          `${target.name} (${target.roleLabel}) yetkili hesabı sistemden kaldırıldı.`
        );

        showToast(`${target.name} kullanıcısı silindi.`, 'info');
      };

      // Kullanıcı Değiştirme (Simülasyon)
      const handleSwitchUser = (userId) => {

    function ManualMessageSection({ smsBalance, onSend, showToast }) {
      const [target, setTarget] = useState('9-A');
      const [text, setText] = useState('');

      const len = text.length;
      const credits = Math.ceil(len / 160) || 1;

      const handleSend = (e) => {
        e.preventDefault();
        if (!text.trim()) {
          showToast('Lütfen bir mesaj yazın!', 'error');
          return;
        }
        onSend({ targetDesc: `${target} Velileri`, count: 32 * credits, messageText: text });
        setText('');
      };

      return (
        <div className="p-4 md:p-8 max-w-7xl w-full mx-auto flex flex-col gap-6">
          <div className="pb-4 border-b border-slate-800">
            <h2 className="font-headline font-bold text-lg text-white">Manuel Mesaj Gönderim Merkezi</h2>

        if (!name.trim() || !phone.trim() || !password.trim()) {

        if (role === 'vice_principal') roleLabel = 'Müdür Yardımcısı';

        const initials = name.split(' ').map(n => n[0]).join('').substring(0, 2).toUpperCase();

        onAddUser({ name, phone, password, role, roleLabel, title: roleLabel, avatar: initials || 'KU' });
        setName('');
        setPhone('');
        setPassword('');
        setIsModalOpen(false);

        if (userToDelete) {
          onDeleteUser(userToDelete.id);
          setUserToDelete(null);

                      Yeni Kullanıcı Ekle
                    </button>
                  )}
                </div>

                <div className="overflow-x-auto">
                  <table className="w-full text-left text-xs border-collapse">
                    <thead>
                      <tr className="border-b border-slate-800 text-slate-400 bg-slate-900/50 font-semibold">
                        <th className="py-2.5 px-3">Ad Soyad</th>
                        <th className="py-2.5 px-3">Telefon No</th>
                        <th className="py-2.5 px-3">Rol</th>
                        <th className="py-2.5 px-3">Şifre</th>
                        <th className="py-2.5 px-3">Kayıt Tarihi</th>
                        <th className="py-2.5 px-3 text-right">Eylemler</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-800 text-slate-300">
                      {users.map(u => (
                        <tr key={u.id} className="hover:bg-slate-800/40">
                          <td className="py-3 px-3 font-semibold flex items-center gap-2">
                            <span className="w-7 h-7 rounded-full bg-slate-800 flex items-center justify-center font-bold text-[11px] text-white">
                              {u.avatar}
                            </span>
                            <span className="text-white">{u.name}</span>
                            {u.id === currentUser?.id && <span className="text-[10px] text-emerald bg-emerald-950/80 border border-emerald-900 px-1 rounded font-bold">Aktif</span>}
                          </td>
                          <td className="py-3 px-3 font-code text-slate-300 font-semibold">{u.phone}</td>
                          <td className="py-3 px-3">
                            <span className={`px-2 py-0.5 rounded font-bold text-[11px] border ${
                              u.role === 'admin' ? 'bg-amber-950/50 text-amber-300 border-amber-800' :
                              u.role === 'principal' ? 'bg-blue-950/50 text-blue-300 border-blue-800' :
                              u.role === 'vice_principal' ? 'bg-indigo-950/50 text-indigo-300 border-indigo-800' :
                              'bg-slate-800 text-slate-300 border-slate-700'
                            }`}>
                              {u.roleLabel}
                            </span>
                          </td>
                          <td className="py-3 px-3 font-code text-slate-500">••••••••</td>
                          <td className="py-3 px-3 text-slate-400">{u.createdAt}</td>
                          <td className="py-3 px-3 text-right">
                            <div className="flex items-center justify-end gap-2">
                              {u.id !== currentUser?.id && (
                                <button onClick={() => setUserToSwitch(u)} className="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 rounded text-[11px] font-semibold text-slate-200" title="Bu hesaba giriş yap">
                                  Giriş Yap
                                </button>
                              )}
                              {isAdmin && u.role !== 'admin' && (
                                <button onClick={() => setUserToDelete(u)} className="p-1 text-slate-400 hover:text-crimson" title="Kullanıcıyı Sil">
                                  <span className="material-symbols-outlined text-[17px]">delete</span>
                                </button>
                              )}
                            </div>
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>

              {/* 1. YENİ KULLANICI OLUŞTURMA MODALI */}
              {isModalOpen && (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/70 backdrop-blur-xs">
                  <form onSubmit={handleCreate} className="bg-[#0F172A] p-6 rounded-xl border border-slate-800 max-w-sm w-full flex flex-col gap-3 text-xs">
                    <h3 className="font-bold text-sm text-white">Yeni Yetkili Kullanıcı Ekle</h3>
                    <div>
                      <label className="font-semibold text-slate-300">Ad Soyad:</label>
                      <input type="text" value={name} onChange={(e) => setName(e.target.value)} placeholder="Örn: Mehmet Özkan" className="w-full p-2 mt-1 border border-slate-700 rounded bg-slate-900 text-white" required />
                    </div>
                    <div>
                      <label className="font-semibold text-slate-300">Telefon Numarası:</label>
                      <input type="text" value={phone} onChange={(e) => setPhone(e.target.value)} placeholder="Örn: 0532 555 44 33" className="w-full p-2 mt-1 border border-slate-700 rounded bg-slate-900 text-white font-code" required />
                    </div>
                    <div>
                      <label className="font-semibold text-slate-300">Yetki Rolü:</label>
                      <select value={role} onChange={(e) => setRole(e.target.value)} className="w-full p-2 mt-1 border border-slate-700 rounded bg-slate-900 text-white font-semibold">
                        <option value="principal">Müdür (Okul Müdürü)</option>
                        <option value="vice_principal">Müdür Yardımcısı</option>
                        <option value="teacher">Öğretmen</option>
                        <option value="admin">Admin (Yönetici)</option>
                      </select>
                    </div>
                    <div>
                      <div className="flex justify-between items-center">
                        <label className="font-semibold text-slate-300">Giriş Şifresi:</label>
                        <button type="button" onClick={() => setShowPwd(s => !s)} className="text-[11px] text-blue-400 hover:underline">
                          {showPwd ? 'Gizle' : 'Göster'}
                        </button>
                      </div>
                      <input type={showPwd ? "text" : "password"} value={password} onChange={(e) => setPassword(e.target.value)} placeholder="Şifre belirleyin" className="w-full p-2 mt-1 border border-slate-700 rounded bg-slate-900 text-white font-code" required />
                    </div>
                    <div className="flex justify-end gap-2 pt-3 border-t border-slate-800">
                      <button type="button" onClick={() => setIsModalOpen(false)} className="px-3 py-1.5 text-slate-400 hover:text-white">İptal</button>
                      <button type="submit" className="px-4 py-1.5 bg-navy text-white font-bold rounded hover:bg-blue-900">Kullanıcıyı Oluştur</button>
                    </div>
                  </form>
                </div>
              )}

              {/* 2. SİLME ONAY MODALI (İstediğinize Emin misiniz?) */}
              {userToDelete && (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/80 backdrop-blur-xs">
                  <div className="bg-[#0F172A] rounded-xl border border-red-900/80 max-w-md w-full p-6 shadow-2xl flex flex-col gap-4 animate-scaleUp text-xs">
                    <div className="flex items-center gap-3">
                      <div className="w-10 h-10 rounded-full bg-red-950/80 border border-red-800 text-crimson flex items-center justify-center flex-shrink-0">
                        <span className="material-symbols-outlined text-[24px]">warning</span>
                      </div>
                      <div>
                        <h3 className="font-headline font-bold text-base text-white">
                          Kullanıcı Hesabını Sil
                        </h3>
                        <p className="text-slate-400">Bu işlem geri alınamaz</p>
                      </div>
                    </div>

                    <div className="p-3 bg-slate-900 rounded-lg border border-slate-800 text-slate-300 leading-relaxed">
                      <strong className="text-white">{userToDelete.name}</strong> (<span className="text-amber-400">{userToDelete.roleLabel}</span>) kullanıcısını silmek istediğinize <strong className="text-red-400">emin misiniz?</strong> Bu hesaba ait tüm erişim yetkileri kaldırılacaktır.
                    </div>

                    <div className="flex items-center justify-end gap-3 pt-2">
                      <button 
                        type="button" 
                        onClick={() => setUserToDelete(null)}
                        className="px-4 py-2 text-xs font-semibold text-slate-400 hover:bg-slate-800 rounded-md"
                      >
                        Vazgeç
                      </button>
                      <button 
                        type="button" 
                        onClick={handleConfirmDelete}
                        className="px-5 py-2 text-xs font-bold bg-crimson text-white rounded-md hover:bg-red-700 shadow-xs"
                      >
                        Evet, Hesabı Sil
                      </button>
                    </div>
                  </div>
                </div>
              )}

              {/* 3. BAŞKA BİRİSİNİN HESABINA GİRİŞ YAPMA UYARI / ONAY MODALI */}
              {userToSwitch && (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/80 backdrop-blur-xs">
                  <div className="bg-[#0F172A] rounded-xl border border-blue-900/80 max-w-md w-full p-6 shadow-2xl flex flex-col gap-4 animate-scaleUp text-xs">
                    <div className="flex items-center gap-3">
                      <div className="w-10 h-10 rounded-full bg-blue-950/80 border border-blue-800 text-blue-400 flex items-center justify-center flex-shrink-0">
                        <span className="material-symbols-outlined text-[24px]">switch_account</span>
                      </div>
                      <div>
                        <h3 className="font-headline font-bold text-base text-white">
                          Hesap Geçişi Uyarısı
                        </h3>
                        <p className="text-slate-400">Başka bir kullanıcının oturumuna geçiyorsunuz</p>
                      </div>
                    </div>

                    <div className="p-3 bg-slate-900 rounded-lg border border-slate-800 text-slate-300 leading-relaxed">
                      <strong className="text-white">{userToSwitch.name}</strong> (<span className="text-blue-300 font-semibold">{userToSwitch.roleLabel}</span>) hesabına giriş yapmak üzeresiniz. 
                      <div className="mt-2 text-slate-400 text-[11px]">
                        Bu oturum süresince göndereceğiniz SMS'ler ve yapacağınız işlemler <strong>{userToSwitch.name}</strong> adına denetim raporlarına kaydedilecektir. Ekranın altında Admin Login barı gösterilecektir.
                      </div>
                    </div>

                    <div className="flex items-center justify-end gap-3 pt-2">
                      <button 
                        type="button" 
                        onClick={() => setUserToSwitch(null)}
                        className="px-4 py-2 text-xs font-semibold text-slate-400 hover:bg-slate-800 rounded-md"
                      >
                        Vazgeç
                      </button>
                      <button 
                        type="button" 
                        onClick={handleConfirmSwitch}
                        className="px-5 py-2 text-xs font-bold bg-navy text-white rounded-md hover:bg-blue-900 shadow-xs"
                      >
                        Evet, Hesaba Giriş Yap
                      </button>
                    </div>
                  </div>
                </div>
              )}

            </div>
          )}

        </div>
      );
    }

    // Uygulamayı DOM'a Bağla
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<MainApp />);
  </script>
</body>
</html>
